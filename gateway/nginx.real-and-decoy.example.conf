# EXAMPLE ONLY. This file is NOT used by docker-compose.yml (that stack mounts gateway/nginx.conf).
# Copy it to a host you control, replace every placeholder, and test it before go-live.
# Placeholders: app.example.com, real-app.internal:8443, decoy-web, decoy-ssh, decoy-banners,
# decoy-dockerapi and /etc/ssl/example/*.pem. Full guide: docs/DEPLOY_ALONGSIDE_REAL_SERVICE.md
#
# Rules this file depends on:
#   - The real application must never use the decoy paths (/.env, /.git/, /backup/, ...).
#   - Decoy routes exist only in the default servers below, never in the real hostname server.
#   - Hiding a port is not a control. Real SSH, MySQL, Redis and the Docker API stay behind a
#     firewall, VPN or bastion (see docs/examples/firewall-allowlist.md). They are not proxied here.
#   - Decoy hosts must have no route to internal networks and no outbound internet access.

worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Do not print the nginx version in error pages or headers.
    server_tokens off;

    # The decoys refuse bodies larger than 64 KB. A real server block may set a larger limit
    # if the real application takes uploads; do not raise it for the decoy servers.
    client_max_body_size 64k;

    # No gateway access log. Keep your own access log for the real site (see the guide's
    # legal and privacy notes before you log visitor addresses).
    access_log off;

    # 1. The real service. Only the real hostname reaches it. No decoy paths and no decoy upstream.
    server {
        listen 443 ssl;
        server_name app.example.com;

        ssl_certificate     /etc/ssl/example/app.pem;
        ssl_certificate_key /etc/ssl/example/app.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            # The real app is HTTPS on a private address. Verify its certificate.
            proxy_pass https://real-app.internal:8443;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/example/internal-ca.pem;

            proxy_set_header Host $host;
            # Overwrite, never append: a visitor cannot choose the address the app sees.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # 2. Plain HTTP for the real hostname: redirect to HTTPS. No decoy here.
    server {
        listen 80;
        server_name app.example.com;
        return 301 https://$host$request_uri;
    }

    # 3. Default server for HTTPS: an unknown Host header, a bare IP address, or no SNI.
    # This is the decoy web. Use a certificate for the decoy hostname you publish.
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/ssl/example/decoy.pem;
        ssl_certificate_key /etc/ssl/example/decoy.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Scanner-only paths. Kept explicit so the intent is visible, and so that changing
        # location / does not drop them. They go to the decoy, never to the real app.
        location ~ ^/(\.env|\.git/|wp-login\.php|wp-admin/|phpmyadmin|pma|server-status|backup/) {
            proxy_pass http://decoy-web:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location / {
            proxy_pass http://decoy-web:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }

    # 4. Default server for plain HTTP: an unknown Host or a bare IP goes to the decoy web.
    server {
        listen 80 default_server;
        server_name _;

        location ~ ^/(\.env|\.git/|wp-login\.php|wp-admin/|phpmyadmin|pma|server-status|backup/) {
            proxy_pass http://decoy-web:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location / {
            proxy_pass http://decoy-web:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }

    # 5. Fake Docker Engine API (plain HTTP). Only on the decoy address. The real Docker API
    # must never listen on a public address.
    server {
        listen 2375;

        location / {
            proxy_pass http://decoy-dockerapi:2375;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}

# Raw TCP. nginx writes a PROXY protocol v1 line before the first byte of each connection, so
# the decoy records the real visitor address. The decoys need QLURE_PROXY_PROTOCOL=required
# (the default): a connection without the line is dropped.
stream {
    # Public SSH port 22 -> fake SSH. Bind it to the decoy address (for example
    # 203.0.113.10:22) if the same host runs sshd on another address.
    server {
        listen 22;
        proxy_pass decoy-ssh:2222;
        proxy_protocol on;
    }

    # Real SSH is NOT proxied here. Real sshd listens only on a VPN or management address,
    # for example 10.8.0.1:22, and the firewall lets only the VPN or bastion subnet reach it.
    # Never send real SSH through this file.

    # FTP: public 21 -> fake FTP banner (the decoy listens on 2121 inside).
    server {
        listen 21;
        proxy_pass decoy-banners:2121;
        proxy_protocol on;
    }

    # MySQL and Redis banners. Real databases are never published here.
    server {
        listen 3306;
        proxy_pass decoy-banners:3306;
        proxy_protocol on;
    }

    server {
        listen 6379;
        proxy_pass decoy-banners:6379;
        proxy_protocol on;
    }
}
