# The only container that touches both networks. Visitors reach the decoys through
# it; the decoys sit on an internal network with no route to the internet.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    access_log off;
    server_tokens off;
    client_max_body_size 64k;

    server {
        listen 8080;
        location / {
            proxy_pass http://web:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }

    server {
        listen 8081;
        location / {
            proxy_pass http://api:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}

# Raw TCP services. PROXY protocol passes the real visitor address to each decoy,
# which reads that line before any protocol bytes.
stream {
    server {
        listen 2222;
        proxy_pass ssh:2222;
        proxy_protocol on;
    }
    server {
        listen 2121;
        proxy_pass banners:2121;
        proxy_protocol on;
    }
    server {
        listen 3306;
        proxy_pass banners:3306;
        proxy_protocol on;
    }
    server {
        listen 6379;
        proxy_pass banners:6379;
        proxy_protocol on;
    }
}
