# Render Blueprint for the hosted QLure demo.
#
# This is a READ-ONLY demo dashboard with SAMPLE data, not a live honeypot. At build time
# tools/seed_demo.py drives the decoys in-process (no ports, no network) to create a verified
# sample database, then tools/prepare_hosted_demo.py turns judge mode on through the settings
# API (audited), so settings changes and Clear All are refused. The data is rebuilt on every
# deploy; the free plan has no disk.
#
# The SSH, FTP, MySQL and Redis decoys are NOT deployed: a Render web service exposes only
# public HTTP(S), and a public honeypot is out of scope (QLure is designed for localhost).
#
# No secret lives in this file. The login password and session secret are generated by Render
# (generateValue) and can be read or rotated in the service's Environment tab.
services:
  - type: web
    name: qlure-demo
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    buildCommand: >-
      pip install -e ".[decoys,dashboard]"
      && python tools/seed_demo.py --db data/demo.db --logs data/demo-logs --force
      && python tools/prepare_hosted_demo.py --db data/demo.db --settings data/settings.json
    startCommand: python -m uvicorn dashboard.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: QLURE_DB
        value: data/demo.db
      - key: QLURE_LOGS
        value: data/demo-logs
      - key: QLURE_SETTINGS
        value: data/settings.json
      - key: QLURE_LIVE
        value: "0"
      - key: QLURE_COOKIE_SECURE
        value: "1"
      - key: QLURE_DASHBOARD_PASSWORD
        generateValue: true
      - key: QLURE_DASHBOARD_SECRET
        generateValue: true
