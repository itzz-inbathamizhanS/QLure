# Q-Lure stack. Decoys sit only on `decoynet` (internal: no internet access).
# The gateway is the one container on both networks, so visitors reach the decoys
# through it. Published ports bind to 127.0.0.1 only.

x-decoy: &decoy
  build:
    context: .
    dockerfile: decoys/Dockerfile
  image: qlure-decoy:phase1
  volumes:
    - ./logs:/var/log/qlure
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:8080"   # web admin portal
      - "127.0.0.1:8081:8081"   # REST API
      - "127.0.0.1:2222:2222"   # SSH-like server
      - "127.0.0.1:2121:2121"   # FTP banner
      - "127.0.0.1:3306:3306"   # MySQL banner
      - "127.0.0.1:6379:6379"   # Redis banner
    networks:
      edge: {}
      decoynet:
        ipv4_address: 172.30.0.2
    depends_on: [web, api, ssh, banners]
    user: "101:101"
    read_only: true
    tmpfs: ["/tmp:uid=101,gid=101"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped

  web:
    <<: *decoy
    environment:
      QLURE_REPLAY_TOKEN: ${QLURE_REPLAY_TOKEN:-}   # empty: replay times are ignored
      QLURE_CONTENT: /runtime/content.json
    volumes:
      - ./logs:/var/log/qlure
      - ./runtime:/runtime:ro   # fake-content settings only, written by the dashboard
    command: >
      uvicorn decoys.web.app:app --host 0.0.0.0 --port 8080 --no-server-header
      --proxy-headers --forwarded-allow-ips 172.30.0.2
      --limit-concurrency 100 --timeout-keep-alive 5
    networks:
      decoynet:
        ipv4_address: 172.30.0.10
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  api:
    <<: *decoy
    environment:
      QLURE_REPLAY_TOKEN: ${QLURE_REPLAY_TOKEN:-}   # empty: replay times are ignored
    command: >
      uvicorn decoys.api.app:app --host 0.0.0.0 --port 8081 --no-server-header
      --proxy-headers --forwarded-allow-ips 172.30.0.2
      --limit-concurrency 100 --timeout-keep-alive 5
    networks:
      decoynet:
        ipv4_address: 172.30.0.11
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  ssh:
    <<: *decoy
    command: python -m decoys.ssh.server
    networks:
      decoynet:
        ipv4_address: 172.30.0.12
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  banners:
    <<: *decoy
    environment:
      QLURE_CONTENT: /runtime/content.json
    volumes:
      - ./logs:/var/log/qlure
      - ./runtime:/runtime:ro
    command: python -m decoys.banners.listeners
    networks:
      decoynet:
        ipv4_address: 172.30.0.13
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  forwarder:
    <<: *decoy
    command: qlure forward --follow --logs /var/log/qlure --db /var/lib/qlure/qlure.db
    volumes:
      - ./logs:/var/log/qlure:ro
      - ./data:/var/lib/qlure
    network_mode: none   # reads files only; needs no network at all
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  # Operator dashboard. Not on decoynet: it cannot reach a decoy and no decoy can reach it.
  # Reads the logs read-only, writes only data/. Published on 127.0.0.1:9000 only.
  dashboard:
    <<: *decoy
    command: uvicorn dashboard.app:app --host 0.0.0.0 --port 9000 --no-server-header
    volumes:
      - ./logs:/var/log/qlure
      - ./data:/var/lib/qlure
      - ./runtime:/runtime
    environment:
      QLURE_DB: /var/lib/qlure/qlure.db
      QLURE_LOGS: /var/log/qlure
      QLURE_SETTINGS: /var/lib/qlure/settings.json
      QLURE_MODEL: /var/lib/qlure/model.json
      QLURE_CONTENT: /runtime/content.json
      QLURE_DASHBOARD_PASSWORD: ${QLURE_DASHBOARD_PASSWORD:-}
    ports:
      - "127.0.0.1:9000:9000"
    networks: [admin]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

networks:
  admin: {}
  edge: {}
  decoynet:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
