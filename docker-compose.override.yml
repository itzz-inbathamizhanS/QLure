# Windows fix: SQLite WAL cannot run on a bind mount, so keep data/ in a named volume.
services:
  forwarder:
    volumes:
      - ./logs:/var/log/qlure:ro
      - qlure-data:/var/lib/qlure
  dashboard:
    environment:
      TZ: Asia/Kolkata   # sets the container clock only; dashboard times are still shown in UTC
    volumes:
      - ./logs:/var/log/qlure
      - qlure-data:/var/lib/qlure
      - ./runtime:/runtime
  # The watchdog's alerts belong with the rest of data/, so it uses the same volume.
  egress-watch:
    volumes:
      - qlure-data:/var/lib/qlure
volumes:
  qlure-data: {}
