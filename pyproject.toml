[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qlure"
version = "0.1.0"
description = "Q-Lure: decoy services and defensive threat observation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
decoys = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "uvicorn>=0.30,<1",
    "asyncssh>=2.17,<3",
]
pqc = ["liboqs-python>=0.12"]
dashboard = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9",
    "dnspython>=2.6,<3",
    "cryptography>=43",
    "requests>=2.32,<3",
    "python-whois>=0.9,<1",
]
dev = [
    "qlure[decoys,dashboard,pqc]",
    "pytest>=8,<9",
    "ruff>=0.6",
]

[project.scripts]
qlure = "qlure.cli:main"

[tool.setuptools.packages.find]
include = ["qlure*", "decoys*", "dashboard*"]

[tool.setuptools.package-data]
decoys = ["honeytokens.yaml", "fakefs/*.yaml"]
"qlure.rules" = ["rules.yaml"]
"decoys.web" = ["templates/*.html"]
dashboard = ["templates/*.html", "static/*"]
"qlure.pqcscan" = ["crypto_registry/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"qlure/pqcscan/**" = ["E501", "E731", "B904", "B905", "UP031", "UP042"]  # vendored from Q-CAPS; style kept as received
