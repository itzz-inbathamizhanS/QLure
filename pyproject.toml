[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qlure"
version = "0.1.0"
description = "Q-Lure: decoy services and defensive threat observation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
decoys = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "uvicorn>=0.30,<1",
]
dev = [
    "qlure[decoys]",
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.6",
]

[project.scripts]
qlure = "qlure.cli:main"

[tool.setuptools.packages.find]
include = ["qlure*", "decoys*"]

[tool.setuptools.package-data]
"decoys.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
